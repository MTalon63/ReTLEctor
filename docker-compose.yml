services:
    retlector:
        image: ghcr.io/mrtalon63/retlector
        ports:
            - 3000:3000
        environment:
            - ALLOWED_GROUPS=visual # Extra Celestrak groups to serve; "active" is always included. See https://celestrak.org/NORAD/elements/
            - SPECIAL_GROUPS=gpz,gpz-plus,decaying # Fetched with SPECIAL= instead of GROUP=; listing a group here also enables it
            - WARM_ON_START=1 # Fetch every configured group once at startup instead of waiting for a request.
            - CACHE_DURATION=86400 # Specifies for how long to cache standard TLEs in seconds.
            - CACHE_ACTIVE_DURATION=7200 # Specifies for how long to cache active group TLEs in seconds. (Active group is used for per NORAD ID requests)
            - CACHE_NORAD_DURATION=86400 # Specifies per-NORAD ID cache duration in seconds.
            - RATE_LIMIT_MAX_REQUESTS=60 # Maximum number of requests allowed within the rate limit window.
            - RATE_LIMIT_WINDOW=60 # Duration of the rate limit window in seconds.
            - KV_FILE=./data/kv.json # Path to the key-value store file.
            - UPSTREAM_TIMEOUT=60 # Seconds to wait for response headers.
            - UPSTREAM_STALL=30 # Abort a download only when no bytes arrive for this long.
            - KV_WRITE_DELAY=1000 # ms to batch KV writes (cache only, safe to lose on crash)
            - LOG_LEVEL=info # Log level (e.g., debug, info, warn, error).
            - PORT=3000 # Port to run the server on.
            - CONTACT_EMAIL=admin@example.com # Operator contact email/info sent in User-Agent header to Celestrak.
            - CELESTRAK_URL=https://celestrak.org/NORAD/elements/gp.php # Upstream Celestrak API URL.
            - SPACETRACK_USER= # Optional: Space-Track.org account, used only for the single hourly GP pull.
            - SPACETRACK_PASS=
            - SPACETRACK_GP_MINUTE=12 # Minute past the hour for the hourly GP query; avoid :00 and :30.
            - SPACETRACK_MAX_AGE_DAYS=30 # Ignore records whose element epoch is older than this.
            - SPACETRACK_LOGIN_COOLDOWN=900 # Seconds to back off after a rejected login.
            - GP_INDEX_FILE=./data/gp-index.csv # Local store of merged GP records.
            - DISCORD_WEBHOOK_URL= # Optional Discord webhook for upstream failure/recovery alerts. Leave empty to disable.
            - SITE_URL=https://example.com # Public domain URL of this instance.
            - GITHUB_URL=https://github.com/MrTalon63/ReTLEctor # Repository link shown in footer and header.
            - APP_NAME=ReTLEctor # Application title.
        volumes:
            - data:/app/data # Storage path for cached TLEs.
